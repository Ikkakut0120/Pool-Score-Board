<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Score Board</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .scoreboard {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .players {
            display: flex;
            justify-content: space-around;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .player-name {
            width: 40%;
        }

        .name-buttons {
            margin-top: 10px;
        }

        .name-buttons button {
            font-size: 16px;
            padding: 8px 15px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .score-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 40%;
        }

        .score {
            font-size: 70px;
            font-weight: bold;
            min-width: 100px;
        }

        .current-score {
            font-size: 140px;
            font-weight: bold;
            line-height: 1;
            min-width: 180px;
        }

        .score-button {
            width: 55px;
            height: 55px;
            padding: 0;
            font-size: 30px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .game-button {
            margin: 20px 0;
            font-size: 28px;
            padding: 15px 40px;
            font-weight: bold;
        }

        .reset-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .reset-buttons button {
            font-size: 18px;
            padding: 12px 20px;
        }

        #message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>

<body>

<div class="scoreboard">

    <!-- 選手名 -->
    <div class="players">

        <div class="player-name">
            <div id="nameA">PLAYER A</div>

            <div class="name-buttons">
                <button onclick="editNameA()">名前変更</button>
            </div>
        </div>

        <div class="player-name">
            <div id="nameB">PLAYER B</div>

            <div class="name-buttons">
                <button onclick="editNameB()">名前変更</button>
            </div>
        </div>

    </div>


    <!-- 先取ポイント -->
    <div class="section-title">
        先取ポイント
    </div>

    <div class="score-row">

        <!-- PLAYER A -->
        <div class="score-box">

            <button class="score-button" onclick="minusGameA()">−</button>

            <div class="score" id="gameA">0</div>

            <button class="score-button" onclick="addGameA()">＋</button>

        </div>


        <!-- PLAYER B -->
        <div class="score-box">

            <button class="score-button" onclick="minusGameB()">−</button>

            <div class="score" id="gameB">0</div>

            <button class="score-button" onclick="addGameB()">＋</button>

        </div>

    </div>


    <!-- 今のポイント -->
    <div class="section-title">
        今のポイント
    </div>

    <div class="score-row">

        <!-- PLAYER A -->
        <div class="score-box">

            <button class="score-button" onclick="minusScoreA()">−</button>

            <div class="current-score" id="scoreA">0</div>

            <button class="score-button" onclick="addScoreA()">＋</button>

        </div>


        <!-- PLAYER B -->
        <div class="score-box">

            <button class="score-button" onclick="minusScoreB()">−</button>

            <div class="current-score" id="scoreB">0</div>

            <button class="score-button" onclick="addScoreB()">＋</button>

        </div>

    </div>


    <!-- ゲーム終了 -->
    <button class="game-button" onclick="finishGame()">
        ゲーム終了
    </button>


    <!-- メッセージ -->
    <div id="message"></div>


    <!-- リセット -->
    <div class="reset-buttons">

        <button onclick="resetCurrentScore()">
            今のポイントを0にする
        </button>

        <button onclick="resetGamePoints()">
            先取ポイントを0にする
        </button>

        <button onclick="resetNames()">
            名前リセット
        </button>

        <button onclick="undo()">
            ↶ 元に戻す
        </button>

    </div>

</div>


<script>

    let gameA = 0;
    let gameB = 0;

    let scoreA = 0;
    let scoreB = 0;

    let nameA = "PLAYER A";
    let nameB = "PLAYER B";

    let history = [];


    /* 履歴保存 */

    function saveHistory() {

        history.push({
            gameA: gameA,
            gameB: gameB,
            scoreA: scoreA,
            scoreB: scoreB,
            nameA: nameA,
            nameB: nameB
        });

        if (history.length > 50) {
            history.shift();
        }
    }


    /* 表示更新 */

    function updateDisplay() {

        document.getElementById("gameA").textContent = gameA;
        document.getElementById("gameB").textContent = gameB;

        document.getElementById("scoreA").textContent = scoreA;
        document.getElementById("scoreB").textContent = scoreB;

        document.getElementById("nameA").textContent = nameA;
        document.getElementById("nameB").textContent = nameB;
    }


    /* PLAYER A 先取ポイント */

    function addGameA() {

        saveHistory();

        gameA++;

        updateDisplay();
    }


    function minusGameA() {

        if (gameA > 0) {

            saveHistory();

            gameA--;

            updateDisplay();
        }
    }


    /* PLAYER B 先取ポイント */

    function addGameB() {

        saveHistory();

        gameB++;

        updateDisplay();
    }


    function minusGameB() {

        if (gameB > 0) {

            saveHistory();

            gameB--;

            updateDisplay();
        }
    }


    /* PLAYER A 今のポイント */

    function addScoreA() {

        saveHistory();

        scoreA++;

        updateDisplay();
    }


    function minusScoreA() {

        if (scoreA > 0) {

            saveHistory();

            scoreA--;

            updateDisplay();
        }
    }


    /* PLAYER B 今のポイント */

    function addScoreB() {

        saveHistory();

        scoreB++;

        updateDisplay();
    }


    function minusScoreB() {

        if (scoreB > 0) {

            saveHistory();

            scoreB--;

            updateDisplay();
        }
    }


    /* ゲーム終了 */

    function finishGame() {

        if (scoreA === 0 && scoreB === 0) {

            alert("今のポイントが0 - 0です。");

            return;
        }


        if (scoreA === scoreB) {

            alert("同点のためゲームを終了できません。");

            return;
        }


        saveHistory();

        /* 先取ポイントは変更しない */

        scoreA = 0;
        scoreB = 0;

        document.getElementById("message").textContent =
            "ゲーム終了：今のポイントを0 - 0にしました。";

        updateDisplay();
    }


    /* 今のポイントリセット */

    function resetCurrentScore() {

        saveHistory();

        scoreA = 0;
        scoreB = 0;

        document.getElementById("message").textContent = "";

        updateDisplay();
    }


    /* 先取ポイントリセット */

    function resetGamePoints() {

        saveHistory();

        gameA = 0;
        gameB = 0;

        document.getElementById("message").textContent = "";

        updateDisplay();
    }


    /* PLAYER A 名前変更 */

    function editNameA() {

        saveHistory();

        let newName = prompt(
            "PLAYER Aの名前を入力してください。",
            nameA
        );

        if (newName !== null && newName.trim() !== "") {

            nameA = newName.trim();

            updateDisplay();
        }
    }


    /* PLAYER B 名前変更 */

    function editNameB() {

        saveHistory();

        let newName = prompt(
            "PLAYER Bの名前を入力してください。",
            nameB
        );

        if (newName !== null && newName.trim() !== "") {

            nameB = newName.trim();

            updateDisplay();
        }
    }


    /* 名前リセット */

    function resetNames() {

        saveHistory();

        nameA = "PLAYER A";
        nameB = "PLAYER B";

        updateDisplay();
    }


    /* 元に戻す */

    function undo() {

        if (history.length === 0) {

            alert("元に戻せる操作がありません。");

            return;
        }


        let previous = history.pop();

        gameA = previous.gameA;
        gameB = previous.gameB;

        scoreA = previous.scoreA;
        scoreB = previous.scoreB;

        nameA = previous.nameA;
        nameB = previous.nameB;

        document.getElementById("message").textContent = "";

        updateDisplay();
    }


</script>

</body>
</html>
